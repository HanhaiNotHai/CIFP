[project]
name = "cifp"
version = "0.1.0"
description = "Content-Invariant Compositional Forensic Primitive Learning"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pillow>=12,<13",
    "pyarrow>=18,<24",
    "pyyaml>=6,<7",
    "scikit-learn>=1.9,<2",
    "tensorboard>=2.21,<3",
    "torch==2.11.0",
    "torch-tb-profiler>=0.4.3",
    "torchvision==0.26.0",
    "tqdm>=4.67,<5",
    "transformers==5.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU and the local DINOv3 weights",
    "distributed: exercises multi-process distributed behavior",
    "smoke: end-to-end training or evaluation smoke test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

